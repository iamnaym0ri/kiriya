<!doctype html>
<!-- Shown inside the kiriya.love app only when kiriya.love can't be reached (no signal). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>kiriya.love</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center;
        background: linear-gradient(160deg, #f6eefb 0%, #e8d8f3 60%, #dcc5ec 100%);
        color: #4b2f5c; font: 16px/1.6 -apple-system, "Helvetica Neue", sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      h1 { font: italic 400 52px/1 Georgia, serif; margin: 0 0 14px; }
      p { margin: 0 auto 22px; max-width: 280px; color: #6b5279; }
      button {
        border: 0; border-radius: 12px; padding: 13px 22px; min-height: 48px;
        background: #6e4a85; color: #fff; font: 600 15px -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>kiriya <span aria-hidden="true">✦</span></h1>
      <p>Your little world needs a bit of signal to open. It’s waiting right here ♡</p>
      <button onclick="location.href='https://kiriya.love/world'">Try again</button>
    </main>
  </body>
</html>
