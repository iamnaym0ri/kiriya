<!doctype html>
<!-- A verbatim copy of src/world/today/NoteJar.jsx's JarArtwork + the jar rules of NoteJar.css, for
     side-by-side comparison with the SwiftUI jar. Query: ?fresh=2&drawing=1&paper=1 -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Gaegu";font-weight:400;src:url("../../../../node_modules/@fontsource/gaegu/files/gaegu-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Gaegu";font-weight:700;src:url("../../../../node_modules/@fontsource/gaegu/files/gaegu-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:400;src:url("../../../../node_modules/@fontsource/m-plus-rounded-1c/files/m-plus-rounded-1c-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:700;src:url("../../../../node_modules/@fontsource/m-plus-rounded-1c/files/m-plus-rounded-1c-latin-700-normal.woff2") format("woff2")}
:root{--font-hand:"Gaegu",cursive;--font-ui:"M PLUS Rounded 1c",system-ui}
body{margin:0;background:#fff9fd;font-family:var(--font-ui);color:#54385f}
.stage{width:393px;padding:20px 22px;box-sizing:border-box}
.micro-label{display:block;font-size:10px;line-height:1.6;letter-spacing:.17em;font-weight:500}
.note-jar__art{width:100%;max-width:275px;height:auto;overflow:visible;display:block;margin:auto}.jar-label{font:19px var(--font-hand);fill:#87608f}.jar-vessel{transform-origin:180px 350px}.jar-lid{transform-origin:180px 118px}.jar-folded-note{transform-box:fill-box;transform-origin:center;animation:jar-paper-settle 6s ease-in-out infinite;animation-delay:calc(var(--paper)*-.8s)}.jar-charm{font:29px Georgia;fill:#bd91b4;animation:jar-charm-float 5s ease-in-out infinite;animation-delay:calc(var(--charm)*-1.2s)}.jar-bow{transform-origin:0 0}.jar-flying-note{transform-origin:180px 153px;opacity:0}
.jar-pull-cycle[data-drawing="true"] .jar-vessel{animation:jar-shake .75s ease-in-out both}.jar-pull-cycle[data-drawing="true"] .jar-lid{animation:jar-lid-lift .75s cubic-bezier(.25,.7,.2,1) both}.jar-pull-cycle[data-drawing="true"] .jar-flying-note{animation:jar-note-flight .8s cubic-bezier(.2,.7,.3,1) both}.jar-pull-cycle[data-drawing="true"] .jar-folded-note{animation:jar-notes-tumble .55s ease-in-out both}
.note-jar__day{border:1px dashed #ba98c7;background:#e4d5ec;padding:6px 12px;rotate:-2deg;font:18px/1.1 var(--font-hand);text-align:center;width:fit-content;margin:0 auto 8px}
.note-jar__day[data-fresh]{border-color:#e0476f;background:#ffe5ef;color:#a8244d}.note-jar__day[data-fresh]>span{color:#e0476f}
.note-jar__reading{position:relative;min-width:0;padding:17px 0 0;margin-top:20px}.note-jar__tape{position:absolute;width:110px;height:29px;top:5px;left:calc(50% - 55px);background:#e9c8dfbd;rotate:-4deg;z-index:2;pointer-events:none;clip-path:polygon(2% 0,98% 0,100% 13%,98% 26%,100% 42%,98% 59%,100% 78%,98% 100%,2% 100%,0 85%,2% 68%,0 53%,2% 36%,0 17%)}
.note-jar__paper{min-height:295px;background:#fffdf9;border:1px solid #decbdc;box-shadow:0 7px 18px #60436512,4px 4px 0 #f3e8f1;padding:28px 21px 19px;rotate:1deg;transform-origin:50% 100%;display:flex;flex-direction:column;overflow-wrap:anywhere}.note-jar__paper--open{animation:jar-card-unfold .55s cubic-bezier(.2,.7,.2,1) both}.note-jar__paper>.micro-label{font-size:9px;color:#8b6c92;line-height:1.5}.note-jar__salutation{font:25px var(--font-hand);color:#a57aa1;margin:18px 0 9px}.note-jar__message{font:28px/1.2 var(--font-hand);margin:0 0 19px;flex:1}.note-jar__byline{font:20px var(--font-hand);color:#917297;margin:0 0 9px}.note-jar__paper-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px dashed #e1cedf;padding-top:10px;flex-wrap:wrap}.note-jar__paper-footer>small{font-size:9px;line-height:1.5;color:#836b8b;max-width:180px}.note-jar__keep{display:flex;align-items:center;gap:6px;min-height:44px;flex-shrink:0;padding:6px 9px;border:0;border-radius:6px;background:#f3e6f0;color:#805087;font:18px var(--font-hand)}
@keyframes jar-shake{0%,100%{rotate:0deg;translate:0 0}15%{rotate:-4deg;translate:0 2px}30%{rotate:4deg}45%{rotate:-3deg}65%{rotate:1deg;translate:0 -2px}}
@keyframes jar-lid-lift{0%,17%,100%{translate:0 0;rotate:0deg}43%,78%{translate:12px -43px;rotate:12deg}}
@keyframes jar-note-flight{0%,27%{opacity:0;translate:0 55px;rotate:-8deg;scale:.7}42%{opacity:1}75%{opacity:1;translate:15px -94px;rotate:12deg;scale:1.12}100%{opacity:0;translate:75px -133px;rotate:23deg;scale:1.2}}
@keyframes jar-notes-tumble{0%,100%{rotate:0deg;translate:0 0}30%{rotate:-6deg;translate:0 -4px}65%{rotate:4deg;translate:0 -1px}}
@keyframes jar-paper-settle{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
@keyframes jar-card-unfold{0%{opacity:.3;transform:translateY(13px) rotate(-2deg) scaleY(.96)}100%{opacity:1;transform:translateY(0) rotate(0) scaleY(1)}}
@keyframes jar-charm-float{0%,100%{translate:0 0;opacity:.6}50%{translate:0 -7px;opacity:.95}}
.jar-fresh__heart{transform-box:fill-box;transform-origin:center;animation:jar-fresh-beat 1.6s ease-in-out infinite}
.jar-fresh__count{font:700 15px var(--font-ui,system-ui);fill:#fff}
.jar-fresh__spark{font:15px Georgia;fill:#e0476f;opacity:.75;animation:jar-charm-float 2.4s ease-in-out infinite;animation-delay:calc(var(--spark,0)*-1.1s)}
[data-fresh] .jar-vessel,[data-fresh] .jar-lid{animation:jar-fresh-wiggle 4.5s ease-in-out infinite}
@keyframes jar-fresh-beat{0%,100%{scale:1}12%{scale:1.16}24%{scale:.98}36%{scale:1.1}50%{scale:1}}
@keyframes jar-fresh-wiggle{0%,70%,100%{rotate:0deg}75%{rotate:-2.5deg}80%{rotate:2.5deg}85%{rotate:-1.5deg}90%{rotate:1deg}}
</style></head><body><div class="stage" id="stage"></div>
<script>
const q=new URLSearchParams(location.search),fresh=+(q.get("fresh")||0),drawing=q.get("drawing")==="1",paper=q.get("paper")==="1";
const notes=[[106,278,-19,"#d6bee8"],[213,294,14,"#efc5d9"],[159,318,-8,"#fff5df"],[127,235,16,"#efcbdc"],[209,230,-17,"#ded0ec"],[154,275,9,"#fff8eb"],[96,323,17,"#e2d2ef"],[241,329,-15,"#fff4e7"]];
const id="j";
const svg=`<svg class="note-jar__art" viewBox="0 0 360 390" aria-hidden="true">
<defs>
<linearGradient id="${id}-glass" x1="0" x2="1" y2="1"><stop stop-color="#fffaff" stop-opacity=".9"/><stop offset=".5" stop-color="#dcc7eb" stop-opacity=".35"/><stop offset="1" stop-color="#e7bfda" stop-opacity=".75"/></linearGradient>
<linearGradient id="${id}-lid" x2="0" y2="1"><stop stop-color="#e9c8da"/><stop offset="1" stop-color="#be8fae"/></linearGradient>
<clipPath id="${id}-inside"><path d="M106 120h148v20c0 25 30 26 30 63v115q0 31-31 31H107q-31 0-31-31V203c0-37 30-38 30-63Z"/></clipPath>
</defs>
<ellipse cx="180" cy="359" rx="119" ry="13" fill="#b697cc" opacity=".17"/>
<g class="jar-pull-cycle" data-drawing="${drawing}">
<g class="jar-vessel">
<path d="M106 120h148v20c0 25 30 26 30 63v115q0 31-31 31H107q-31 0-31-31V203c0-37 30-38 30-63Z" fill="url(#${id}-glass)" stroke="#ae8abb" stroke-width="2.5"/>
<g clip-path="url(#${id}-inside)">
${notes.map(([x,y,a,c],i)=>`<g transform="translate(${x} ${y}) rotate(${a})"><g class="jar-folded-note" style="--paper:${i}"><rect x="-25" y="-16" width="58" height="34" rx="3" fill="${c}" stroke="#b597bb" stroke-width="1.3"/><path d="m-23-13 28 16 26-16" fill="none" stroke="#c3a4c4"/><path d="M1 5q-7-8-10-3-3 5 10 11Q14 4 10 0 6-3 1 5" fill="#bb85aa"/></g></g>`).join("")}
</g>
<path d="M103 181q-14 10-14 30v67m1 15v13" fill="none" stroke="#fffaff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
<path d="M265 217v95q0 20-18 20" fill="none" stroke="#b693bf" stroke-width="3" opacity=".35"/>
<path d="M107 142h145" stroke="#fff8fd" stroke-width="6"/>
<path d="M83 193q93 16 194-1" fill="none" stroke="#cda0c3" stroke-width="10"/>
<g class="jar-bow" transform="translate(183 191)">
<path d="M-4-2C-44-36-63-8-42 3c11 7 24 5 38-5ZM4-2C44-35 63-9 42 4c-11 7-26 3-38-6Z" fill="#dda9c5" stroke="#b580a5" stroke-width="2"/>
<path d="m-7 3-22 37 17-5 11-24 17 32 11-10L7 3" fill="#d7a0be" stroke="#b580a5" stroke-width="1.5"/>
<ellipse rx="10" ry="8" fill="#c28aad"/>
</g>
<g transform="rotate(-4 180 266)"><rect x="113" y="244" width="134" height="54" rx="7" fill="#fffaf5" stroke="#ccb3cf"/><rect x="118" y="249" width="124" height="44" rx="5" fill="none" stroke="#ddc9db" stroke-dasharray="3 3"/><text x="180" y="279" text-anchor="middle" class="jar-label">little bits of love</text></g>
</g>
<g class="jar-lid"><ellipse cx="180" cy="111" rx="87" ry="17" fill="#e4bdd4" stroke="#b787a9" stroke-width="2"/><path d="M93 109v17q1 16 87 16t87-16v-17q-5 15-87 15t-87-15Z" fill="url(#${id}-lid)" stroke="#b787a9" stroke-width="2"/><path d="M105 110q65-19 140 0" stroke="#fff6fc" stroke-width="3" opacity=".8" fill="none"/><path d="m133 127 4 9m11-7 3 9m12-8 2 9m13-8v9m14-9-1 8m14-10-2 9m15-11-3 9m15-13-4 9" stroke="#a57a9f" opacity=".4"/></g>
${drawing?`<g class="jar-flying-note"><rect x="153" y="135" width="58" height="43" rx="4" fill="#fffaf3" stroke="#ba94c4" stroke-width="2"/><path d="m156 140 26 17 26-17" fill="none" stroke="#c9a3c5" stroke-width="1.5"/><path d="M182 151q-7-8-10-2-3 5 10 13 13-8 10-13-3-6-10 2" fill="#bb80ad"/></g>`:""}
</g>
${["♡","✧","✿","✦"].map((c,i)=>`<text class="jar-charm" x="${[57,298,278,81][i]}" y="${[180,153,79,79][i]}" style="--charm:${i}">${c}</text>`).join("")}
${fresh>0?`<g class="jar-fresh" transform="translate(262 92)"><g class="jar-fresh__heart"><path d="M0 14C-22-2-24-20-12-25-5-28 0-22 0-18 0-22 5-28 12-25 24-20 22-2 0 14Z" fill="#e0476f" stroke="#a8244d" stroke-width="2.5" stroke-linejoin="round"/><path d="M-13-17q3-5 8-4" fill="none" stroke="#ffd3df" stroke-width="3" stroke-linecap="round"/><text class="jar-fresh__count" y="-2" text-anchor="middle">${fresh>9?"9+":fresh}</text></g><text class="jar-fresh__spark" x="24" y="-22">✦</text><text class="jar-fresh__spark" x="-30" y="-24" style="--spark:1">✧</text></g>`:""}
</svg>`;
const day=fresh>0?`<div class="note-jar__day" data-fresh><span>♥</span> ${fresh===1?"a new little note":`${fresh} new little notes`} from Josh!</div>`:`<div class="note-jar__day"><span>✧</span> today’s little note is waiting</div>`;
const paperHtml=paper?`<div class="note-jar__reading"><div class="note-jar__tape"></div><article class="note-jar__paper note-jar__paper--open"><span class="micro-label">for the 47-tabs-open days</span><p class="note-jar__salutation">hey, u.</p><p class="note-jar__message">you don’t have to finish everything today. close one tab, drink some water, and let me be proud of you anyway.</p><p class="note-jar__byline">— Josh &lt;3</p><div class="note-jar__paper-footer"><small>25 November 2026</small><button class="note-jar__keep">♡ keep this</button></div></article></div>`:"";
document.getElementById("stage").innerHTML=`<div ${fresh>0?"data-fresh":""}>${day}${svg}</div>${paperHtml}`;
</script></body></html>
